<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Neumonía</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #63b3ed;
            margin-bottom: 0.4rem;
        }

        header p { color: #718096; font-size: 0.9rem; }

        .card {
            background: #1a1f2e;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 580px;
            margin-bottom: 1.25rem;
        }

        #drop-zone {
            border: 2px dashed #4a5568;
            border-radius: 8px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        #drop-zone:hover, #drop-zone.drag-over {
            border-color: #63b3ed;
            background: rgba(99, 179, 237, 0.05);
        }

        #drop-zone svg { margin: 0 auto 1rem; display: block; opacity: 0.5; }
        #drop-zone p { color: #718096; font-size: 0.9rem; }
        #drop-zone strong { color: #63b3ed; }
        #file-input { display: none; }

        #preview-section { display: none; text-align: center; }

        #preview-img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            margin-bottom: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #63b3ed;
            color: #0f1117;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) { background: #90cdf4; }
        button:disabled { background: #4a5568; cursor: not-allowed; }

        #loading { display: none; text-align: center; padding: 1rem; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2d3748;
            border-top-color: #63b3ed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #results-section { display: none; }

        .diagnosis-main {
            text-align: center;
            padding: 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
        }

        .diagnosis-main.normal   { background: rgba(72,187,120,0.12); border: 1px solid rgba(72,187,120,0.35); }
        .diagnosis-main.bacterial { background: rgba(245,101,101,0.12); border: 1px solid rgba(245,101,101,0.35); }
        .diagnosis-main.viral    { background: rgba(237,137,54,0.12); border: 1px solid rgba(237,137,54,0.35); }

        .diag-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #718096;
            margin-bottom: 0.3rem;
        }

        .diag-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.2rem; }
        .diag-confidence { font-size: 0.9rem; color: #a0aec0; }
        .diag-time { font-size: 0.75rem; color: #4a5568; margin-top: 0.2rem; }

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4a5568;
            margin-bottom: 0.9rem;
        }

        .prob-list { list-style: none; }

        .prob-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.7rem;
        }

        .prob-name {
            width: 175px;
            font-size: 0.85rem;
            color: #a0aec0;
            flex-shrink: 0;
        }

        .prob-bar-wrap {
            flex: 1;
            background: #2d3748;
            border-radius: 4px;
            height: 8px;
            margin: 0 0.75rem;
            overflow: hidden;
        }

        .prob-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .bar-normal    { background: #48bb78; }
        .bar-bacterial { background: #f56565; }
        .bar-viral     { background: #ed8936; }

        .prob-pct {
            width: 45px;
            text-align: right;
            font-size: 0.85rem;
            font-weight: 600;
        }

        #error-section {
            display: none;
            background: rgba(245,101,101,0.1);
            border: 1px solid rgba(245,101,101,0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #fc8181;
            font-size: 0.9rem;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #4a5568;
            color: #a0aec0;
            margin-top: 1rem;
        }

        .secondary-btn:hover:not(:disabled) { background: #2d3748; color: #e2e8f0; }
    </style>
</head>
<body>
    <header>
        <h1>Diagnóstico de Neumonía</h1>
        <p>Clasificación de radiografías de tórax · CNN PyTorch</p>
    </header>

    <div class="card">
        <div id="drop-zone" onclick="document.getElementById('file-input').click()">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#63b3ed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p><strong>Arrastra una radiografía</strong> o haz clic para seleccionarla</p>
            <p style="margin-top:0.4rem;font-size:0.8rem;">JPG · JPEG · PNG &nbsp;·&nbsp; Máx. 10 MB</p>
        </div>
        <input type="file" id="file-input" accept="image/jpeg,image/jpg,image/png" />

        <div id="preview-section">
            <img id="preview-img" src="" alt="Radiografía seleccionada" />
            <button id="predict-btn" onclick="runPrediction()">Analizar radiografía</button>
        </div>
    </div>

    <div class="card" id="loading">
        <div class="spinner"></div>
        <p style="text-align:center;color:#718096;">Analizando radiografía...</p>
    </div>

    <div class="card" id="error-section">
        <span id="error-msg"></span>
        <button class="secondary-btn" onclick="reset()">Intentar con otra imagen</button>
    </div>

    <div class="card" id="results-section">
        <p class="section-title">Diagnóstico</p>
        <div class="diagnosis-main" id="diagnosis-main">
            <div class="diag-label">Resultado principal</div>
            <div class="diag-name" id="diag-name"></div>
            <div class="diag-confidence" id="diag-confidence"></div>
            <div class="diag-time" id="diag-time"></div>
        </div>
        <p class="section-title">Distribución de probabilidades</p>
        <ul class="prob-list" id="prob-list"></ul>
        <button class="secondary-btn" onclick="reset()">Analizar otra imagen</button>
    </div>

    <script>
        const API_BASE = window.location.origin;

        const CLASS_COLORS = {
            NORMAL: 'bar-normal',
            PNEUMONIA_BACTERIAL: 'bar-bacterial',
            PNEUMONIA_VIRAL: 'bar-viral',
        };

        const CLASS_CSS = {
            NORMAL: 'normal',
            PNEUMONIA_BACTERIAL: 'bacterial',
            PNEUMONIA_VIRAL: 'viral',
        };

        let selectedFile = null;

        const dropZone = document.getElementById('drop-zone');

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        document.getElementById('file-input').addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            if (!file.type.match(/^image\/(jpeg|jpg|png)$/i)) {
                showError('Formato no soportado. Usa JPG o PNG.');
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showError('El archivo supera el límite de 10 MB.');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('preview-img').src = e.target.result;
                show('preview-section');
                hide('results-section');
                hide('error-section');
            };
            reader.readAsDataURL(file);
        }

        async function runPrediction() {
            if (!selectedFile) return;

            hide('preview-section');
            hide('results-section');
            hide('error-section');
            show('loading');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch(`${API_BASE}/predict`, {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || `Error ${response.status}`);
                showResults(data);
            } catch (err) {
                showError(err.message || 'Error de conexión con la API.');
            } finally {
                hide('loading');
            }
        }

        function showResults(data) {
            const { prediction, label, confidence, inference_time_ms, probabilities } = data;

            const diagMain = document.getElementById('diagnosis-main');
            diagMain.className = `diagnosis-main ${CLASS_CSS[prediction] || 'normal'}`;
            document.getElementById('diag-name').textContent = label || prediction;
            document.getElementById('diag-confidence').textContent =
                `Confianza: ${(confidence * 100).toFixed(1)}%`;
            document.getElementById('diag-time').textContent =
                `Tiempo de inferencia: ${inference_time_ms} ms`;

            const probList = document.getElementById('prob-list');
            probList.innerHTML = '';
            probabilities.forEach(item => {
                const pct = (item.probability * 100).toFixed(1);
                const li = document.createElement('li');
                li.className = 'prob-item';
                li.innerHTML = `
                    <span class="prob-name">${item.label || item.class}</span>
                    <div class="prob-bar-wrap">
                        <div class="prob-bar ${CLASS_COLORS[item.class] || 'bar-normal'}"
                             style="width:${pct}%"></div>
                    </div>
                    <span class="prob-pct">${pct}%</span>
                `;
                probList.appendChild(li);
            });

            show('results-section');
            show('preview-section');
        }

        function showError(msg) {
            document.getElementById('error-msg').textContent = msg;
            show('error-section');
        }

        function reset() {
            selectedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('preview-img').src = '';
            ['preview-section', 'results-section', 'error-section', 'loading'].forEach(hide);
        }

        function show(id) { document.getElementById(id).style.display = 'block'; }
        function hide(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
